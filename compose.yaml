# Tessera for self-hosting: the web server, a queue worker, the scheduler, and PostgreSQL.
#
# Put APP_KEY, APP_URL, and DB_PASSWORD in a .env file next to this one, then
# follow docs/self-hosting/docker.md.

x-tessera: &tessera
  image: ${TESSERA_IMAGE:-tessera:latest}
  build: .
  restart: unless-stopped
  environment:
    APP_NAME: ${APP_NAME:-Tessera}
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: tessera
    DB_USERNAME: tessera
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: local
    TESSERA_MODULES: ${TESSERA_MODULES:-*}
    TESSERA_SINGLE_ORGANIZATION: ${TESSERA_SINGLE_ORGANIZATION:-true}
    TESSERA_TRUSTED_PROXIES: ${TESSERA_TRUSTED_PROXIES:-}
    TESSERA_CLOSED_ORGANIZATION_DAYS: ${TESSERA_CLOSED_ORGANIZATION_DAYS:-30}
    TESSERA_SOURCE_URL: ${TESSERA_SOURCE_URL:-}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-tessera@example.org}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tessera}
  volumes:
    - uploads:/app/storage/app

services:
  app:
    <<: *tessera
    command: web
    ports:
      - "${TESSERA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  queue:
    <<: *tessera
    command: queue
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *tessera
    command: scheduler
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username tessera --dbname tessera"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  uploads:
  database:
